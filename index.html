
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Teetly | Academic Homepage</title>

<style>
  :root {
    --link: #1772d0;
    --text: #333;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: white;
    color: var(--text);
    font: 15px/1.65 Arial, Helvetica, sans-serif;
  }

  main {
    max-width: 850px;
    margin: 55px auto;
    padding: 0 24px;
  }

  a {
    color: var(--link);
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  h1 {
    font-size: 30px;
    font-weight: 400;
    margin: 0 0 12px;
  }

  h2 {
    font-size: 22px;
    font-weight: 400;
    margin: 36px 0 15px;
    padding-bottom: 6px;
    border-bottom: 1px solid #eee;
  }

  /* Profile */

  .profile {
    display: flex;
    align-items: center;
    gap: 38px;
  }

  .profile-info {
    flex: 1;
  }

  .profile-photo {
    width: 175px;
    height: 175px;
    border-radius: 50%;
    object-fit: cover;
  }

  .links {
    margin-top: 12px;
  }

  .links a {
    margin-right: 5px;
  }

  /* About */

  #about {
    white-space: pre-line;
  }

  .interests {
    padding-left: 24px;
  }

  .interests li {
    margin: 10px 0;
  }

  /* Updates */

  .news {
    padding-left: 20px;
  }

  .news li {
    margin: 9px 0;
  }

  /* Project gallery */

  .project {
    display: flex;
    gap: 24px;
    align-items: flex-start;
    margin: 28px 0 36px;
  }

  .project-image {
    width: 230px;
    height: 155px;
    object-fit: contain;
    flex-shrink: 0;
    border-radius: 4px;
  }

  .project-info {
    flex: 1;
  }

  .project-title {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.5;
  }

  .project-description {
    margin: 8px 0;
  }

  .project-links {
    margin-top: 8px;
  }

  footer {
    text-align: center;
    margin-top: 50px;
    color: #888;
    font-size: 12px;
  }

  @media (max-width: 600px) {
    main {
      margin: 28px auto;
    }

    .profile {
      flex-direction: column-reverse;
    }

    .profile-info {
      width: 100%;
      text-align: center;
    }

    .project {
      flex-direction: column;
    }

    .project-image {
      width: 100%;
      max-width: 400px;
      height: auto;
    }
  }
</style>
</head>

<body>
<main>

  <!-- PROFILE -->
  <header class="profile">
    <div class="profile-info">
      <h1 id="name"></h1>
      <div id="position"></div>
      <div id="university"></div>
      <div id="email"></div>
      <div id="links" class="links"></div>
    </div>

    <img
      id="photo"
      class="profile-photo"
      alt="Profile photo"
      hidden
    >
  </header>

  <!-- ABOUT -->
  <section>
    <h2>About Me</h2>
    <div id="about"></div>

    <p id="interests-intro"></p>
    <ol id="interests" class="interests"></ol>
  </section>

  <!-- UPDATES -->
  <section>
    <h2>Updates</h2>
    <ul id="news" class="news"></ul>
  </section>

  <!-- PROJECT GALLERY -->
  <section>
    <h2>Selected Projects</h2>
    <div id="projects"></div>
  </section>

  <footer id="footer"></footer>

</main>

<script>
const $ = id => document.getElementById(id);

function text(tag, value, className = "") {
  const el = document.createElement(tag);
  el.textContent = value || "";

  if (className) {
    el.className = className;
  }

  return el;
}

function link(label, url) {
  const a = text("a", label);
  a.href = url;

  if (/^https?:\/\//i.test(url)) {
    a.target = "_blank";
    a.rel = "noopener noreferrer";
  }

  return a;
}

function addLinks(parent, items) {
  let first = true;

  Object.entries(items || {}).forEach(([label, url]) => {
    if (!url) return;

    if (!first) {
      parent.append(" / ");
    }

    parent.append(link(label, url));
    first = false;
  });
}

async function load() {
  const response = await fetch("./config.json");

  if (!response.ok) {
    throw new Error("Cannot load config.json");
  }

  const data = await response.json();

  // Profile
  document.title = data.name + " | Academic Homepage";

  $("name").textContent = data.name || "";
  $("position").textContent = data.position || "";
  $("university").textContent = data.university || "";
  $("email").textContent = data.email || "";

  $("footer").textContent =
    "© " + new Date().getFullYear() + " " + data.name;

  if (data.photo) {
    $("photo").src = data.photo;
    $("photo").hidden = false;
  }

  addLinks($("links"), data.links);

  // About Me
  $("about").textContent = data.about || "";

  // Research interests
  if (data.interests && data.interests.length) {
    $("interests-intro").textContent =
      "My interests are as follows:";

    data.interests.forEach(interest => {
      const li = document.createElement("li");

      li.append(text("strong", interest.title + ". "));
      li.append(
        document.createTextNode(interest.description)
      );

      $("interests").append(li);
    });
  }

  // Updates
  (data.news || []).forEach(item => {
    const li = document.createElement("li");

    li.append(text("strong", item.date + ": "));
    li.append(
      document.createTextNode(item.text)
    );

    $("news").append(li);
  });

  // Selected Projects
  (data.projects || []).forEach(project => {
    const row = text("div", "", "project");

    // Project image
    if (project.image) {
      const img = document.createElement("img");
      img.src = project.image;
      img.alt = project.title;
      img.className = "project-image";

      row.append(img);
    }

    // Project information
    const info = text("div", "", "project-info");

    const title = text(
      "div",
      project.title,
      "project-title"
    );

    info.append(title);

    if (project.description) {
      info.append(
        text(
          "p",
          project.description,
          "project-description"
        )
      );
    }

    // Project link
    if (project.url) {
      const links = text(
        "div",
        "",
        "project-links"
      );

      links.append(
        link(
          project.linkLabel || "View Project",
          project.url
        )
      );

      info.append(links);
    }

    row.append(info);
    $("projects").append(row);
  });
}

load().catch(error => {
  console.error(error);

  $("about").textContent =
    "Could not load website content. Check config.json.";
});
</script>

</body>
</html>
